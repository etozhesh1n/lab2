#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
# COMPAT включает системную кодировку Windows: без этого Gradle записывает
# список классов тестов в UTF-8, а JVM читает его в системной кодировке, и
# тесты не запускаются из папки, в пути к которой есть русские буквы.
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=COMPAT
org.gradle.configuration-cache=true
org.gradle.caching=true
